# Free Render web service paired with an external Neon Free PostgreSQL database.
# The database URL and credentials are prompted by Render and are not stored here.
services:
  - type: web
    name: workshop-seat-booking-portal
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: PORTAL_ADMIN_USERNAME
        sync: false
      - key: PORTAL_ADMIN_PASSWORD
        sync: false


