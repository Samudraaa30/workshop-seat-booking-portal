<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My bookings | Workshoply</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark nav-glass"><div class="container"><a class="navbar-brand fw-bold" href="/">✦ Workshoply</a><div class="d-flex gap-2"><a class="btn btn-outline-light btn-sm" href="/">Attendee: All workshops</a><a class="btn btn-outline-light btn-sm" href="/admin/login">Admin sign in</a></div></div></nav>
<main class="container py-5 booking-page"><div class="eyebrow">YOUR WORKSHOPS</div><h1 class="section-title mb-2">My bookings</h1><p class="text-secondary mb-4">Enter the email address you used when booking.</p>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<form method="get" action="/my-bookings" class="search-form mb-4"><input class="form-control" type="email" name="email" th:value="${email}" placeholder="you@example.com" required><button class="btn btn-dark">Find bookings</button></form>
<div th:if="${!#strings.isEmpty(email) and bookings.isEmpty()}" class="empty-state">No bookings found for this email.</div>
<section class="notification-panel mt-4" th:if="${!notifications.isEmpty()}" aria-labelledby="notifications-title">
<div class="eyebrow">UPDATES</div><h2 id="notifications-title" class="h4 mb-3">Notifications <span class="badge text-bg-dark" th:text="${notifications.size()}">0</span></h2>
<article class="notification-item" th:each="notification : ${notifications}"><div class="d-flex flex-wrap justify-content-between gap-2"><strong th:text="${notification.title}">Notification</strong><time class="text-secondary small" th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, HH:mm')}"></time></div><p class="mb-0 mt-1" th:text="${notification.message}"></p></article>
</section>
<div class="booking-row" th:each="b : ${bookings}"><div><span class="status" th:text="${b.status}" th:classappend="${b.status == 'CONFIRMED' ? ' status-ok' : ' status-cancelled'}"></span><h3 class="mt-2" th:text="${b.workshop.title}"></h3><div class="text-secondary small" th:text="${#temporals.format(b.createdAt, 'dd MMM yyyy, HH:mm')}"></div></div>
<form th:if="${b.status == 'CONFIRMED'}" method="post" th:action="@{/cancel}" onsubmit="return confirm('Cancel this booking?')"><input type="hidden" name="bookingId" th:value="${b.id}"><input type="hidden" name="email" th:value="${email}"><button class="btn btn-outline-danger btn-sm">Cancel booking</button></form></div>
</main><footer class="container py-4 footer-line"><span>Workshoply</span><a href="/">Back to workshops</a></footer></body></html>
