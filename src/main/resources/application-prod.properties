spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:workshops}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
portal.vit-import.enabled=${VIT_IMPORT_ENABLED:true}
portal.vit-import.default-capacity=${VIT_IMPORT_DEFAULT_CAPACITY:30}
portal.vit-import.interval-ms=${VIT_IMPORT_INTERVAL_MS:3600000}

